<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>globalai</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23201d1d'/%3E%3Cpath d='M18 20h12v4h-8v16h8v4H18V20zm16 0h12v4h-8v16h8v4H34V20z' fill='%23fdfcfc'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/app.css" />

  <body>
    <div class="app-frame">
      <div class="app-shell">
        <aside class="sidebar">
          <div class="sidebar-header">
            <div class="brand">
              <p class="brand-mark">globalai</p>
              <h1 class="brand-title">viewer</h1>
            </div>
            <div id="summary" class="summary"></div>
          </div>
          <nav class="source-nav" aria-label="Sources">
            <ul id="source-list" class="source-list"></ul>
          </nav>
        </aside>
        <main class="content">
          <div class="content-inner">
            <header class="content-header">
              <h2 id="source-title">Loading…</h2>
              <div id="source-meta" class="meta-line"></div>
            </header>
            <section id="content-panel" class="content-panel" aria-live="polite" data-state="loading">
              <p id="content-state" class="content-state">Loading local sources…</p>
              <pre id="source-content" class="source-content" hidden></pre>
            </section>
          </div>
        </main>
      </div>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
