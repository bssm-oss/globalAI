name: ci

on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Verify formatting
        run: |
          test -z "$(gofmt -s -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Build CLI
        run: go build ./cmd/globalai

      - name: Run functional smoke test
        run: bash scripts/functional_smoke.sh
